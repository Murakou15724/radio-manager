name: Keep alive

on:
  schedule:
    # UTC 23:00–14:55 = 日本時間 08:00–23:55（毎日5分間隔）
    - cron: '*/5 0-14,23 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Access health check
        env:
          APP_URL: https://stylish-radio-manager.onrender.com
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 60 \
            --retry 3 \
            --retry-delay 10 \
            --retry-connrefused \
            --output /dev/null \
            "${APP_URL%/}/up"
